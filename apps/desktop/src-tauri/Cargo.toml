[package]
name = "k8s-ide-desktop"
version = "0.0.0"
description = "k8s-ide Desktop Shell"
authors = ["k8s-ide"]
edition = "2021"

[lib]
name = "k8s_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "k8s-ide-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
