[package]
name = "k8s-ide-desktop"
version = "0.1.0"
description = "Tauri desktop shell for the Kubernetes IDE monorepo"
edition = "2021"

[lib]
name = "k8s_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2" }

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tauri = { version = "2.1.1" }
