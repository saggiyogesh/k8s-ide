[package]
name = "k8s-ide-desktop"
version = "0.1.0"
description = "Tauri shell for the Kubernetes IDE monorepo"
authors = ["Cursor Agent"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
