[package]
name = "k8s-ide-desktop"
version = "0.1.0"
edition = "2021"
description = "k8s-ide desktop shell"
license = "MIT"

[lib]
name = "k8s_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "k8s-ide-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
