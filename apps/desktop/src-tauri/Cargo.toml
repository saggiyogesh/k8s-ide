[package]
name = "k8s-ide-desktop"
version = "0.1.0"
description = "Kubernetes IDE desktop shell"
authors = ["Cursor Cloud Agent"]
edition = "2021"

[lib]
name = "k8s_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
